name: Build STALZONE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate debug keystore for signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare STALZONE.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk STALZONE.apk

      - name: Upload STALZONE.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STALZONE-APK
          path: STALZONE.apk
          retention-days: 90

      - name: Publish STALZONE.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: STALZONE Android APK (Latest)
          body: |
            Автоматическая сборка **STALZONE** для Android.
            Скачайте файл `STALZONE.apk` ниже и установите на телефон.
          files: STALZONE.apk
          make_latest: true
