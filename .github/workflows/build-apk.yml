name: Build STALZONE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=STALZONE,O=STALZONE,C=RU"
          fi
          keytool -list -keystore debug.keystore -storepass android | head -n 10

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Align, sign (v1+v2+v3) and verify STALZONE.apk
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk STALZONE-raw.apk
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 STALZONE-raw.apk STALZONE-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out STALZONE.apk \
            STALZONE-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose STALZONE.apk
          ls -lh STALZONE.apk

      - name: Upload STALZONE.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STALZONE-APK
          path: STALZONE.apk
          retention-days: 90

      - name: Publish STALZONE.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: STALZONE Android APK (Latest)
          body: |
            Автоматическая подписанная сборка **STALZONE** для Android (v1 + v2 + v3 подпись проверена `apksigner`).
            Скачайте файл `STALZONE.apk` ниже и установите на телефон.
          files: STALZONE.apk
          make_latest: true
